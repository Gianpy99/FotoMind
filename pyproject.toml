[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fotomind"
version = "0.1.0"
description = "FotoMind: local-first personal photo library, non-destructive development and AI-assisted enhancement."
readme = "README.md"
requires-python = ">=3.12"
# Dependencies live in requirements*.txt (FamilyPortal Docker convention); pyproject reuses them.
dynamic = ["dependencies"]

[project.scripts]
fotomind-api = "fotomind.main:run"
fotomind-openapi = "fotomind.main:export_openapi"
fotomind-worker = "fotomind.workers.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["fotomind*"]

[tool.setuptools.package-data]
"fotomind.modules.places" = ["data/*.tsv.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires external services such as PostgreSQL (FOTOMIND_TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]
extend-exclude = ["apps", "packages", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
